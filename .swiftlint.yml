# SwiftLint runs with --strict in CI, so a warning fails the run. A warning
# nobody has to fix is noise.

included:
  - App
  - Core/Sources
  - Core/Tests

excluded:
  - .build
  - build
  - Kioskalator.xcodeproj

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  # swift-format owns formatting. Two tools with an opinion about the same line
  # means the repository has no defined formatting at all.
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment
  - closure_parameter_position

line_length:
  warning: 100
  error: 100
  ignores_urls: true
  ignores_comments: false

identifier_name:
  min_length: 2
  excluded: [id, to, up]

type_body_length:
  warning: 320
  error: 400

file_length:
  warning: 420
  error: 520

function_body_length:
  warning: 60
  error: 90

cyclomatic_complexity:
  warning: 12
  error: 16

nesting:
  type_level: 2
